name: security

on:
  pull_request:
  push:
    branches:
      - main
      - 'm6/**'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xzf - -C .
          chmod +x gitleaks

      - name: Run gitleaks
        run: ./gitleaks git --redact --verbose .